<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종족연구소 업데이트 플래너</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/planner.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-mark">LAB</span>
                <span class="brand-text">종족연구소 업데이트 플래너</span>
            </div>

            <nav class="month-nav" aria-label="월 이동">
                <button type="button" class="nav-btn" id="prevMonthBtn" aria-label="이전 달">&lsaquo;</button>
                <h1 class="month-title" id="monthTitle">2026년 10월 업데이트</h1>
                <button type="button" class="nav-btn" id="nextMonthBtn" aria-label="다음 달">&rsaquo;</button>
            </nav>

            <div class="topbar-tools">
                <span class="save-status" id="saveStatus" data-state="idle">저장됨</span>
                <button type="button" class="tool-btn" id="todayMonthBtn" title="이번 달로 이동">이번 달</button>
                <button type="button" class="tool-btn" id="exportBtn">백업 내보내기</button>
                <button type="button" class="tool-btn" id="importBtn">백업 불러오기</button>
                <input type="file" id="importFile" accept=".json,application/json" hidden>
            </div>
        </div>
    </header>

    <main class="page">
        <section class="add-bar">
            <div class="add-bar-text">
                <strong id="entryCount">0개의 일정</strong>
                <span class="add-bar-hint">날짜는 달력 범위와 관계없이 자유롭게 추가할 수 있어요. 날짜순으로 자동 정렬됩니다.</span>
            </div>
            <form class="add-form" id="addForm">
                <input type="date" id="addDateInput" required aria-label="추가할 날짜">
                <button type="submit" class="primary-btn">+ 날짜 추가</button>
            </form>
        </section>

        <section class="entries" id="entries" aria-live="polite"></section>

        <div class="empty" id="emptyState" hidden>
            <p class="empty-title">아직 이 달의 업데이트 계획이 없어요.</p>
            <p class="empty-sub">위에서 날짜를 선택하고 <b>+ 날짜 추가</b>를 눌러 시작하세요.</p>
        </div>
    </main>

    <template id="entryTemplate">
        <article class="entry">
            <header class="entry-head">
                <div class="entry-date">
                    <span class="entry-year"></span>
                    <h2 class="entry-day"></h2>
                    <span class="entry-weekday"></span>
                    <button type="button" class="expand-btn" data-action="expand" aria-label="크게 보기" title="크게 보기">
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <polyline points="9 21 3 21 3 15"></polyline>
                            <line x1="21" y1="3" x2="14" y2="10"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                    </button>
                </div>
                <div class="entry-actions">
                    <input type="date" class="entry-date-input" aria-label="날짜 변경">
                    <button type="button" class="icon-btn danger" data-action="delete" title="이 날짜 카드 삭제">삭제</button>
                </div>
            </header>

            <div class="toolbar" role="toolbar" aria-label="서식">
                <button type="button" class="fmt-btn" data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
                <button type="button" class="fmt-btn" data-cmd="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
                <button type="button" class="fmt-btn" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
                <button type="button" class="fmt-btn" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
                <span class="tb-sep"></span>
                <span class="tb-group"><span class="tb-label">글자색</span><span class="swatches" data-kind="fore"></span></span>
                <span class="tb-sep"></span>
                <span class="tb-group"><span class="tb-label">형광펜</span><span class="swatches" data-kind="hilite"></span></span>
                <span class="tb-sep"></span>
                <button type="button" class="fmt-btn wide" data-cmd="removeFormat" title="선택 영역 서식 지우기">서식 지우기</button>
            </div>

            <div class="editor" contenteditable="true" spellcheck="false" data-placeholder="업데이트 내용을 자유롭게 작성하세요."></div>
        </article>
    </template>

    <!-- 날짜 카드 확대 편집 모달 (툴바는 카드 템플릿의 툴바를 복제해서 사용) -->
    <div class="modal-overlay" id="entryModal" hidden>
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalDay">
            <header class="modal-head">
                <div class="entry-date">
                    <span class="entry-year"></span>
                    <h2 class="entry-day" id="modalDay"></h2>
                    <span class="entry-weekday"></span>
                </div>
                <button type="button" class="modal-close" id="modalCloseBtn" aria-label="닫기" title="닫기 (Esc)">&times;</button>
            </header>
            <div class="modal-toolbar-slot"></div>
            <div class="modal-body">
                <div class="editor modal-editor" contenteditable="true" spellcheck="false" data-placeholder="업데이트 내용을 자유롭게 작성하세요."></div>
            </div>
        </section>
    </div>

    <script src="js/planner.js"></script>
</body>
</html>
